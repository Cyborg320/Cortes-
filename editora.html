<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editora de Vídeos — Cortes Prontos</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background: #0f172a; color: #e2e8f0; padding: 20px; max-width: 900px; margin: 0 auto; }
    h1 { color: #6366f1; margin-bottom: 20px; text-align: center; }
    .card { background: #1e293b; padding: 25px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #334155; }
    button { padding: 12px 24px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin: 5px; transition: transform 0.1s; }
    button:active { transform: scale(0.98); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-principal { background: linear-gradient(90deg, #6366f1, #ec4899); color: white; width: 100%; padding: 15px; font-size: 18px; margin-top: 10px; }
    .btn-sucesso { background: #10b981; color: white; }
    input[type="file"] { padding: 10px; margin: 10px 0; width: 100%; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: white; }
    .barra { width: 100%; height: 15px; background: #334155; border-radius: 8px; margin: 15px 0; overflow: hidden; }
    .barra-preencher { height: 100%; background: linear-gradient(90deg, #6366f1, #10b981); width: 0%; transition: width 0.3s; }
    .log { background: #020617; padding: 15px; border-radius: 8px; margin: 15px 0; font-family: monospace; font-size: 13px; max-height: 200px; overflow-y: auto; color: #94a3b8; }
    .sucesso { color: #10b981; }
    .erro { color: #ef4444; }
    .item { padding: 10px; background: #334155; border-radius: 6px; margin: 8px 0; }
    .oculto { display: none !important; }
  </style>
</head>
<body>

<h1>🎬 Editora de Vídeos</h1>

<div class="card">
  <h2>📂 Carregar Vídeos</h2>
  <input type="file" id="arquivos" accept="video/*" multiple>
  <p id="quantos">Nenhum vídeo carregado</p>
  <div id="lista-arquivos"></div>
</div>

<div class="card">
  <h2>✨ Gerar Vídeos Prontos</h2>
  <p style="color:#94a3b8; margin-bottom:15px;">
    Junta os vídeos carregados, melhora cores e gera 4 versões com durações diferentes. Sem legenda, sem música extra.
  </p>
  <button id="gerar" class="btn-principal">🚀 INICIAR EDIÇÃO</button>
  <p id="etapa" style="margin: 15px 0; font-weight: bold;"></p>
  <div class="barra"><div id="barra-progresso" class="barra-preencher"></div></div>
  <div id="log" class="log"></div>
  <div id="resultados" class="oculto">
    <h3 class="sucesso">✅ Vídeos Gerados!</h3>
    <div id="lista-resultados"></div>
    <button id="baixar-todos" class="btn-sucesso" style="margin-top:15px;">📦 Baixar Todos</button>
  </div>
</div>

<script>
// ==============================================
// SEM FFmpeg — TUDO NATIVO DO NAVEGADOR
// ==============================================

let arquivosCarregados = [];
let arquivosProntos = [];

function log(texto, tipo = '') {
  const el = document.getElementById('log');
  el.innerHTML += `<div class="${tipo}">${texto}</div>`;
  el.scrollTop = el.scrollHeight;
}

function atualizarBarra(porcentagem) {
  document.getElementById('barra-progresso').style.width = porcentagem + '%';
}

function baixar(blob, nome) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = nome;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// Selecionar arquivos
document.getElementById('arquivos').addEventListener('change', e => {
  arquivosCarregados = Array.from(e.target.files).map(f => ({ 
    nome: f.name, 
    blob: f,
    url: URL.createObjectURL(f)
  }));
  document.getElementById('quantos').textContent = `${arquivosCarregados.length} vídeo(s) carregado(s)`;
  document.getElementById('lista-arquivos').innerHTML = arquivosCarregados.map((a, i) => 
    `<div class="item">📎 ${i+1}. ${a.nome}</div>`
  ).join('');
  log(`✅ ${arquivosCarregados.length} arquivo(s) carregado(s)`);
});

// Carregar elemento de vídeo
function carregarVideoElemento(url) {
  return new Promise((resolve) => {
    const video = document.createElement('video');
    video.src = url;
    video.muted = true;
    video.preload = 'auto';
    video.onloadedmetadata = () => resolve(video);
    video.onerror = () => resolve(null);
  });
}

// Criar vídeo editado via Canvas (sem FFmpeg)
async function criarVideoEditado(entradas, duracaoTotal, estilo) {
  return new Promise(async (resolve) => {
    const videos = [];
    for(const entrada of entradas) {
      const v = await carregarVideoElemento(entrada.url);
      if(v) videos.push(v);
    }
    
    if(videos.length === 0) {
      resolve(entradas[0].blob);
      return;
    }

    const L = videos[0].videoWidth || 1280;
    const A = videos[0].videoHeight || 720;
    const fps = 24;
    const tempoPorTrecho = duracaoTotal / videos.length;

    const canvas = document.createElement('canvas');
    canvas.width = L;
    canvas.height = A;
    const ctx = canvas.getContext('2d');

    const stream = canvas.captureStream(fps);
    const gravador = new MediaRecorder(stream, { 
      mimeType: 'video/webm;codecs=vp9',
      videoBitsPerSecond: 2000000
    });
    let quadros = [];
    
    gravador.ondataavailable = e => { if(e.data.size > 0) quadros.push(e.data); };
    gravador.onstop = () => {
      resolve(new Blob(quadros, { type: 'video/webm' }));
      videos.forEach(v => URL.revokeObjectURL(v.src));
    };

    gravador.start();

    let trechoAtual = 0;
    let tempoNoTrecho = 0;
    let ultimoTrecho = -1;
    const intervaloQuadro = 1000 / fps;

    const estilos = {
      completo: { brilho: 1.12, saturacao: 1.15, cor: '#6366f1', titulo: 'EDIÇÃO COMPLETA' },
      curto: { brilho: 1.15, saturacao: 1.25, cor: '#f59e0b', titulo: 'CORTE CURTO' },
      reels: { brilho: 1.18, saturacao: 1.20, cor: '#ec4899', titulo: 'REELS / REDES' },
      resumo: { brilho: 1.08, saturacao: 1.10, cor: '#10b981', titulo: 'RESUMO' }
    };
    
    const cfg = estilos[estilo] || estilos.completo;
    let tempoAnterior = performance.now();

    function desenharQuadro() {
      if(trechoAtual >= videos.length) {
        gravador.stop();
        return;
      }

      const videoAtual = videos[trechoAtual];
      
      if(trechoAtual !== ultimoTrecho) {
        ultimoTrecho = trechoAtual;
        videoAtual.currentTime = 0;
        tempoNoTrecho = 0;
      }

      try {
        if(videoAtual.currentTime < videoAtual.duration) {
          videoAtual.currentTime = Math.min(tempoNoTrecho, videoAtual.duration - 0.1);
        }
      } catch {}

      ctx.drawImage(videoAtual, 0, 0, L, A);
      
      // Efeito: melhora brilho e cor
      const imgData = ctx.getImageData(0, 0, L, A);
      const dados = imgData.data;
      for(let i = 0; i < dados.length; i += 4) {
        dados[i] = Math.min(255, dados[i] * cfg.brilho);
        dados[i+1] = Math.min(255, dados[i+1] * ((cfg.brilho + cfg.saturacao) / 2));
        dados[i+2] = Math.min(255, dados[i+2] * cfg.saturacao);
      }
      ctx.putImageData(imgData, 0, 0);
      
      // Faixa superior escura
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(0, 0, L, 70);
      
      // Título com cor do estilo
      ctx.fillStyle = cfg.cor;
      ctx.font = 'bold 26px Arial';
      ctx.textAlign = 'center';
      ctx.shadowColor = '#000';
      ctx.shadowBlur = 4;
      ctx.fillText(cfg.titulo, L/2, 35);
      
      // Número do trecho
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 18px Arial';
      ctx.fillText(`Trecho ${trechoAtual+1} de ${videos.length}`, L/2, 60);
      
      // Barra de progresso na base
      ctx.fillStyle = 'rgba(255,255,255,0.2)';
      ctx.fillRect(20, A - 20, L - 40, 8);
      ctx.fillStyle = cfg.cor;
      const progresso = (trechoAtual + (tempoNoTrecho / tempoPorTrecho)) / videos.length;
      ctx.fillRect(20, A - 20, (L - 40) * progresso, 8);
      
      ctx.shadowBlur = 0;

      // Avança tempo
      const agora = performance.now();
      const decorrido = agora - tempoAnterior;
      tempoAnterior = agora;
      tempoNoTrecho += decorrido / 1000;

      if(tempoNoTrecho >= tempoPorTrecho) {
        trechoAtual++;
      }

      setTimeout(desenharQuadro, intervaloQuadro);
    }

    desenharQuadro();
  });
}

// Botão principal de geração
document.getElementById('gerar').addEventListener('click', async () => {
  if(arquivosCarregados.length === 0) {
    alert('⚠️ Escolha pelo menos um vídeo primeiro!');
    return;
  }

  const btn = document.getElementById('gerar');
  const etapa = document.getElementById('etapa');
  const resultados = document.getElementById('resultados');
  
  btn.disabled = true;
  resultados.classList.add('oculto');
  document.getElementById('log').innerHTML = '';
  arquivosProntos = [];

  // Definição das 4 versões
  const versoes = [
    { estilo: 'completo', nome: '1_Completo_12s', desc: 'Junta todos — 12s — cores melhoradas', duracao: 12 },
    { estilo: 'curto', nome: '2_Curto_6s', desc: 'Corte rápido — 6s — cores vibrantes', duracao: 6 },
    { estilo: 'reels', nome: '3_Reels_8s', desc: 'Otimizado — 8s — chamativo', duracao: 8 },
    { estilo: 'resumo', nome: '4_Resumo_10s', desc: 'Resumo — 10s — equilíbrio visual', duracao: 10 }
  ];

  // Processa uma por uma
  for(let i = 0; i < versoes.length; i++) {
    const v = versoes[i];
    etapa.textContent = `🎬 ${i+1}/${versoes.length} — ${v.nome}`;
    atualizarBarra(Math.round(((i) / versoes.length) * 100));
    log(`🔄 Processando: ${v.desc}`);
    
    try {
      const video = await criarVideoEditado(arquivosCarregados, v.duracao, v.estilo);
      arquivosProntos.push({ nome: v.nome + '.webm', blob: video, desc: v.desc });
      log(`✅ ${v.nome} pronto!`, 'sucesso');
    } catch(e) {
      log(`❌ Erro em ${v.nome}: ${e.message}`, 'erro');
    }
  }

  atualizarBarra(100);
  etapa.textContent = '✅ Finalizado!';

  // Exibe resultados
  if(arquivosProntos.length > 0) {
    resultados.classList.remove('oculto');
    document.getElementById('lista-resultados').innerHTML = arquivosProntos.map(a => 
      `<div class="item">✅ ${a.nome}<br><small>${a.desc}</small></div>`
    ).join('');
  }

  btn.disabled = false;
});

// Baixar todos os vídeos
document.addEventListener('click', e => {
  if(e.target.id === 'baixar-todos') {
    arquivosProntos.forEach((a, i) => setTimeout(() => baixar(a.blob, a.nome), i * 400));
    alert(`✅ Baixando ${arquivosProntos.length} vídeos!\n\n✅ Junta trechos\n✅ Melhora brilho e cor\n✅ Sem legenda\n✅ Sem música`);
  }
});
</script>

</body>
</html>
